[package]
name = "wasm-opt"
version = "0.121.0"
description = "wasm-opt bindings"
license = "MIT / Apache-2.0"
edition = "2018"
documentation = "https://docs.rs/wasm-opt"
repository = "https://github.com/brson/wasm-opt-rs"
categories = ["wasm"]
readme = "README.md"

[dependencies]
anyhow = "1.0.98"
libc = "0.2.172"
wasm-opt-sys = { path = "../wasm-opt-sys", version = "0.121.0", default-features = false }
wasm-opt-cxx-sys = { path = "../wasm-opt-cxx-sys", version = "0.121.0" }
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0.12"
tempfile = "3.19.1"

[features]
default = ["dwarf"]
dwarf = ["wasm-opt-sys/dwarf"]