[package]
name = "conformance-tests"
version = "0.121.0"
description = "Tests against binaryen"
license = "MIT / Apache-2.0"
edition = "2018"
publish = false

[build-dependencies]
anyhow = "1.0.98"

[dev-dependencies]
anyhow = "1.0.98"
wasm-opt = { path = "../wasm-opt", version = "0.121.0", default-features = false }
tempfile = "3.19.1"

[features]
default = ["dwarf"]
dwarf = ["wasm-opt/dwarf"]
