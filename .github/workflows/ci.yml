name: CI

on:
  push:
    branches: [ "master", "ci" ]
  pull_request:
    branches: [ "master", "ci" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        rust: [stable]
        c-compiler: ['']
        cxx-compiler: ['']
        cxxflags: ['']
        target: ['']
        include:
          - os: ubuntu-latest
            rust: nightly
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            rust: stable
          - os: ubuntu-latest
            rust: stable
          - os: windows-latest
            target: i686-pc-windows-msvc
            rust: stable
          - os: windows-latest
            rust: stable
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            c-compiler: clang
            cxx-compiler: clang++
            rust: stable
          - os: ubuntu-latest
            c-compiler: gcc
            cxx-compiler: g++
            rust: stable
          - os: windows-latest
            rust: 1.48.0
          - os: ubuntu-latest
            rust: 1.48.0
          - os: windows-latest
            rust: stable
            c-compiler: clang-cl
            cxx-compiler: clang-cl
            cxxflags: /EHsc
        

    runs-on: ${{ matrix.os }}

    steps:
      - if: matrix.os == 'ubuntu-latest' && matrix.c-compiler == 'clang'
        name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install clang

      - if: matrix.os == 'ubuntu-latest' && matrix.c-compiler == 'gcc'
        name: Install gcc
        run: |
          sudo apt-get update
          sudo apt-get install gcc g++

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: actions/checkout@v3
      - name: Checkout submodule
        run: git submodule update --init --recursive

      - if: matrix.target != ''
        run: rustup target add ${{matrix.target}}

      - if: ${{ matrix.target != '' && matrix.os == 'ubuntu-latest' }}
        name: Install cross tools
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib g++-multilib

      - name: Build / test
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          C_COMPILER: ${{ matrix.c-compiler }}
          CXX_COMPILER: ${{ matrix.cxx-compiler }}
          CXX_FLAGS: ${{ matrix.cxxflags }}
          MSYS2_ENV_CONV_EXCL: CXXFLAGS
        run: |
          if [[ -n "$C_COMPILER" ]]; then
            export CC="$C_COMPILER"
            export CXX="$CXX_COMPILER"
            "$CC" --version
            "$CXX" --version
          fi
          if [[ -n "$CXX_FLAGS" ]]; then
            export CXXFLAGS="$CXX_FLAGS"
          fi
          rustc --version
          if [[ -n "$TARGET" ]]; then
            cargo build --verbose --target="$TARGET"
            cargo test --target="$TARGET" -- --nocapture
          else
            cargo build --verbose
            cargo test -- --nocapture
          fi

  conformance-tests:
    name: Conformance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Checkout submodule
        run: git submodule update --init --recursive
      - run: cargo test --manifest-path components/conformance-tests/Cargo.toml

  non-dwarf:
    name: Without dwarf feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Checkout submodule
        run: git submodule update --init --recursive
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --manifest-path components/conformance-tests/Cargo.toml

  fmt:
    name: Cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: cargo fmt --check
